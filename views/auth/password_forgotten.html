<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Vite & Gourmand</title>
    <link rel="stylesheet" href="/assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

    <div id="app-header"></div>

    <main class="page-reinit-password">
        <section class="section-reinit-password">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <h1>Mot de passe oublié</h1>
                    </div>
                    <div class="col-12">
                        <p class="mb-0">Saisissez l'adresse email associée à votre compte et
                            nous vous enverrons un lien pour créer un nouveau mot de passe.
                        </p>
                    </div>

                    <!-- Messages -->
                    <div class="col-12" id="password-forgotten-messages"></div>

                    <!-- Formulaire -->
                    <div id="password-forgotten-form-wrapper">
                        <form id="password-forgotten-form">
                            <div class="reinit-password-form">
                                <div class="col-12 reinit-password-label">
                                    <label for="email">Email</label>
                                </div>
                                <div class="col-12 reinit-password-input">
                                    <input 
                                        type="text" 
                                        id="email" 
                                        name="email"
                                        placeholder="mail@mail.fr"
                                        class="reinit-password-input"
                                        required>
                                    <div class="invalid-feedback">Veuillez renseigner une adresse mail valide</div>
                                </div>
                                <div class="col-12 btn-reinit">
                                    <button type="submit" class="btn btn-primary" id="btn-submit" disabled>
                                        Réinitialiser
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="col-12">
                        <a href="/connexion-v2">← Retour à la connexion</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="app-footer"></div>

    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/layouts.js"></script>
    <script src="/assets/js/auth/password_forgotten.js"></script>
    <script>
        loadLayouts('', '')
            .then(() => initPasswordForgotten());
    </script>
</body>
</html>
