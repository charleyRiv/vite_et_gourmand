                    <!-- Contenu chargé par JS -->

                </div>
            </div>
        </section>
    </main>

    <div id="app-footer"></div>

    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/layouts.js"></script>
    <script src="/assets/js/orders/confirmation.js"></script>

        loadLayouts('', '')
