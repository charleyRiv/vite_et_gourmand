<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Vite & Gourmand</title>
    <link rel="stylesheet" href="/assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

    <div id="app-header"></div>
    <div id="app-hero"></div>

    <main class="page-home">

        <!-- Section présentation -->
        <section class="section-home">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <p class="text-center" id="home-intro"></p>
                    </div>
                </div>
                <div class="row gx-5 justify-content-around">
                    <div class="col-auto">
                        <a href="/menus-v2" class="btn btn-primary">Voir les menus</a>
                    </div>
                    <div class="col-auto">
                        <a href="/commande/etape-1" class="btn btn-primary">Commander</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section équipe -->
        <section class="section-team">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-12 col-xl-6">
                        <img 
                            src="/assets/images/uploads/equipe_photo_001.webp"
                            alt="Julie et José, fondateurs de Vite & Gourmand"
                            class="img-fluid w-100"
                        >
                    </div>
                    <div class="col-12 col-xl-6">
                        <p class="text-center" id="home-team"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section avis -->
        <section class="section-avis">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <h4 class="text-center">Les avis de nos clients</h4>
                    </div>
                </div>
                <div class="row" id="home-reviews">
                    <div class="col-12 text-center">
                        <p>Chargement des avis...</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div id="app-footer"></div>

    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/layouts.js"></script>
    <script src="/assets/js/home/home.js"></script>
    <script>
        loadLayouts('Accueil', '/assets/images/uploads/hero_banner_charte_001.jpeg')
            .then(() => initHome());
    </script>
</body>
</html>
